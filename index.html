<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa online</title>
</head>
<body>
    <header>
        <h1>Pesquisa online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados pessoais</legend>       
            
                <label for="name">Nome:</label>
                <input id="name" name="userName" required>
                <br>

                <label for="userAge">Idade:</label>
                <input type="number" name="userAge" required min="12" max="100">
                <br>  

                <label for="userBirthDate">Data de nascimento:</label>
                <input type="date" name="userBirthDate">            
                <br>

                <label for="userEmail">Email:</label>
                <input type="email" name="userEmail" required>
                <br>

                <label for="userPhoneNumber">Telefone:</label>
                <input type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="99999999999">
                <br>

                <label for="userImage">Upload de foto:</label>
                <input type="file" accept="image/*" name="userImage" >
                <br> 

            </fieldset>
            <fieldset>
                <legend>Perfil:</legend>
                <p>Gênero</p>
                <input id = "Feminino" type="radio" name=" userGender" value="Feminino ">
                <label for="Feminino"> Feminino </label>
                <br>
                <input id= "masculino" type="radio" name=" userGender" value="Masculino ">
                <label for="masculino"> Masculino </label>
                <br>
                <input id= "prefiro nao informar" type="radio" name=" userGender" value="Prefiro não informar ">
                <label for="prefiro nao informar"> Prefiro não informar </label>
                <br>
                <label for="matitalStatus"> Estado Civil:</label>  
                <select name="matitalStatus"> 
                   <option value="naoinformado" selected hidden>Selecione...</option>  
                   <option value="casado">Casado</option>
                   <option value="solteiro">Solteiro</option> 
                   <option value="divorciado">Divorciado </option>
                   <option value="união">União estavel </option>
                </select>

                <br>

                <label for="userState">Estado:</label>
                <select name="userState" required>
                    <option value="naoinformado" selected hidden>Selecione...</option>  
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritofederal">Distrito Federal</option>
                    <option value="espiritosanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matogrossoDosul">Mato Grosso do Sul</option>
                    <option value="matogrosso">Mato Grosso</option>
                    <option value="minasgerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="paraná">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="riodejaneiro">Rio de Janeiro</option>
                    <option value="riograndedonorte">Rio Grande do Norte</option>
                    <option value="riograndedosul">Rio Grande do Sul</option>
                    <option value="rondoia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santacatarina">Santa Catarina</option>
                    <option value="saopaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>
                <label for="userCity">Cidade:</label>
                <input type="text" name="userCity" required>
                <br>
            </fieldset>
     
            <fieldset>
                <legend>Hábitos</legend>
                <p>REDES SOCIAIS:</p>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label  for="facebook">Facebook</label>
                <br>
                <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="whatsapp" type="checkbox" name="social" value="whatsapp">
                <label for="whatsapp">Whatsapp</label>
                <br>
                <input id="tiktok" type="checkbox" name="social" value="tiktok">
                <label for="tiktok">Tiktok</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>
                <input id="outros" type="checkbox" name="social" value="outros">
                <label for="outros">Outros</label>
                <br>
                
                <label for="musicalStyle"> Estilo Musical:</label>
                <input id="musicalStyle" name="musicalStyle" type="text" list="styleType">
                <datalist id="styleType">
                    <option value="Rock">
                    <option value="Gaucha">
                    <option value="Sertaneja">
                    <option value="Modão">
                </datalist>
                <br>
                
                <label for="favoriteColor"> Cor Favorita:</label>
                <input id="favoriteColor" name="userFavoritColor" type="color">

            </fieldset>
            
            <fieldset>
                 <legend>Comentarios</legend>
                 <p>Oque você acha da qualidade do nosso serviço?</p>

                    <input type="radio" name="userSatisfaction" value="otimo" id="otimo">
                    <label for="otimo">Ótimo</label>
                    <br>
                    <input type="radio" name="userSatisfaction" value="bom" id="bom">
                    <label for="bom">Bom</label>
                    <br>
                    <input type="radio" name="userSatisfaction" value="regular" id="regular">
                    <label for="regular">Regular</label>
                    <br>
                    <input type="radio" name="userSatisfaction" value="ruim" id="ruim">
                    <label for="ruim">Ruim</label>
                    <br>
                    <label for="comentario">Deixe seu Comentário:</label>
                    <br>
                    <textarea name="userComment" id="userComment" placeholder="Digite aqui sua opnião..."></textarea>

            </fieldset>

            <fieldset>
                 <legend>Confirmações</legend>
            

                    <input type="checkbox" id="userLgpdTerm" name="userLgpdTerm" value="accept" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa.</label>
                    <br>
                    <input type="checkbox" id="userResult" name="userResult" value="accept">
                    <label for="userResult">Eu desejo receber os resultados da pesquisa por e-mail. </label>
                
            </fieldset>

        

        <button type = "submit"> Enviar</button>
        <button type = "reset"> Limpar</button>
        

        </form>
    </section>
</body>
</html>
